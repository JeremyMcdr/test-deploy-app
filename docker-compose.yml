# Docker Compose pour test local
# Usage: docker compose up -d

services:
  web:
    build: .
    ports:
      - "8888:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
