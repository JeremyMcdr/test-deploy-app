# GitHub Actions CI/CD pour Test Deploy App
# Déploie via VPS Central Command (système Stack)

name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Force lowercase pour éviter l'erreur "invalid reference format"
  IMAGE_NAME: jeremymcdr/test-deploy-app
  SERVICE_NAME: web

jobs:
  # Job 1: Build Docker image
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: Deploy via VPS Central Command
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Deploy Stack via VPS Central Command
        run: |
          echo "🚀 Triggering stack deployment via VPS Central Command..."

          VCC_URL="${{ secrets.VCC_URL }}"
          VCC_URL="${VCC_URL%/}"

          echo "Deploying stack: ${VCC_URL}/api/deploy/stack/${{ secrets.VCC_STACK_ID }}"
          echo "Service: ${{ env.SERVICE_NAME }} -> ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${VCC_URL}/api/deploy/stack/${{ secrets.VCC_STACK_ID }}" \
            -H "X-Deploy-Token: ${{ secrets.VCC_DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "images": {
                "${{ env.SERVICE_NAME }}": "ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
              }
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Stack deployment successful!"
          else
            echo "❌ Stack deployment failed (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for containers to start..."
          sleep 15

          VCC_URL="${{ secrets.VCC_URL }}"
          VCC_URL="${VCC_URL%/}"

          echo "🔍 Checking stack status..."
          RESPONSE=$(curl -s "${VCC_URL}/api/deploy/stack/${{ secrets.VCC_STACK_ID }}/status" \
            -H "X-Deploy-Token: ${{ secrets.VCC_DEPLOY_TOKEN }}")

          echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"

          echo "✅ Deployment complete!"
